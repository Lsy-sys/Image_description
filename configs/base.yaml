# 项目基础配置（所有模型通用）
# 各模型配置文件通过 `_base_` 继承此文件，并覆盖差异项

paths:
  # DeepFashion-MultiModal 数据集根目录（包含 train_list.txt / val_list.txt / captions 等）
  data_dir: 'data/DeepFashion-MultiModal'

  # Model E (Graph-Transformer) 额外依赖的预处理目录
  # 注意：Graph-Transformer 建议使用 ViT patch 级节点特征（196x768），默认存这里
  feature_dir: 'data/vit_features'
  graph_dir: 'data/graphs'

data:
  # 图像输入尺寸（非图模型会用到 transforms）
  image_size: 224
  # 构建词表时的最小词频
  min_freq: 5

misc:
  seed: 42


